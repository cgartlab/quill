<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#fff;font:12px/1.4 "Segoe UI",sans-serif;color:#333}
  .row{display:flex;align-items:flex-end;gap:28px;padding:16px 24px;border-bottom:1px solid #eee}
  .dark{background:#0e0e10;color:#aaa;border-bottom-color:#222}
  .cell{display:flex;flex-direction:column;align-items:center;gap:6px}
  .cell span{font-size:10px;color:#999}
  .tag{width:80px;font-weight:600;color:#666}
  .dark .tag{color:#888}
</style></head><body>

<div class="row"><div class="tag">V1 bare</div>
  <div class="cell"><svg id="v1a" width="256" height="256" viewBox="0 0 256 256"></svg><span>256</span></div>
  <div class="cell"><svg id="v1b" width="128" height="128" viewBox="0 0 256 256"></svg><span>128</span></div>
  <div class="cell"><svg id="v1c" width="64" height="64" viewBox="0 0 256 256"></svg><span>64</span></div>
  <div class="cell"><svg id="v1d" width="32" height="32" viewBox="0 0 256 256"></svg><span>32</span></div>
  <div class="cell"><svg id="v1e" width="16" height="16" viewBox="0 0 256 256"></svg><span>16</span></div>
</div>

<div class="row"><div class="tag">V2 rule</div>
  <div class="cell"><svg id="v2a" width="256" height="256" viewBox="0 0 256 256"></svg><span>256</span></div>
  <div class="cell"><svg id="v2b" width="128" height="128" viewBox="0 0 256 256"></svg><span>128</span></div>
  <div class="cell"><svg id="v2c" width="64" height="64" viewBox="0 0 256 256"></svg><span>64</span></div>
  <div class="cell"><svg id="v2d" width="32" height="32" viewBox="0 0 256 256"></svg><span>32</span></div>
</div>

<div class="row"><div class="tag">V3 drop</div>
  <div class="cell"><svg id="v3a" width="256" height="256" viewBox="0 0 256 256"></svg><span>256</span></div>
  <div class="cell"><svg id="v3b" width="128" height="128" viewBox="0 0 256 256"></svg><span>128</span></div>
  <div class="cell"><svg id="v3c" width="64" height="64" viewBox="0 0 256 256"></svg><span>64</span></div>
  <div class="cell"><svg id="v3d" width="32" height="32" viewBox="0 0 256 256"></svg><span>32</span></div>
</div>

<div class="row dark"><div class="tag">V1 on dark</div>
  <div class="cell"><svg id="d1" width="128" height="128" viewBox="0 0 256 256"></svg><span>128</span></div>
  <div class="cell"><svg id="d2" width="48" height="48" viewBox="0 0 256 256"></svg><span>48</span></div>
  <div class="cell"><svg id="d3" width="16" height="16" viewBox="0 0 256 256"></svg><span>16</span></div>
</div>

<div class="row dark"><div class="tag">tile on dark</div>
  <div class="cell"><svg id="t1" width="128" height="128" viewBox="0 0 256 256"></svg><span>128</span></div>
  <div class="cell"><svg id="t2" width="48" height="48" viewBox="0 0 256 256"></svg><span>48</span></div>
</div>

<script>
var FEATHER = "M0 0C7 9 14 24 19 45C23 64 23 88 19 108C16 124 10 138 4 147C2 150.5 1 152 0 153C-3 148 -7 136 -10 120C-14 98 -15 76 -13 54C-11 32 -7 14 0 0Z";
var SLIT    = "M0 18C1.2 38 1.7 62 1.5 92C1.4 110 1 124 0 133C-1 124 -1.4 110 -1.5 92C-1.7 62 -1.2 38 0 18Z";
var STEM    = "M-2.5 140L-2.1 174C-2.1 185 -1.2 196 0 209C1.2 196 2.1 185 2.1 174L2.5 140Z";
var G = 'transform="translate(128 128) scale(0.95) rotate(38) translate(-4 -104.5)"';

function body(color){
  return '<g ' + G + ' fill="' + color + '"><path fill-rule="evenodd" d="' + FEATHER + ' ' + SLIT + '"/><path d="' + STEM + '"/></g>';
}
function extra(id){
  if (id.indexOf('v2') === 0) return '<path d="M56 226H202" stroke="#000" stroke-width="7" stroke-linecap="round"/>';
  if (id.indexOf('v3') === 0) return '<circle cx="58" cy="220" r="9" fill="#000"/>';
  return '';
}
['v1a','v1b','v1c','v1d','v1e','v2a','v2b','v2c','v2d','v3a','v3b','v3c','v3d'].forEach(function(id){
  document.getElementById(id).innerHTML = body('#000') + extra(id);
});
['d1','d2','d3'].forEach(function(id){ document.getElementById(id).innerHTML = body('#fff'); });
['t1','t2'].forEach(function(id){
  document.getElementById(id).innerHTML =
    '<rect x="8" y="8" width="240" height="240" rx="52" fill="#fff"/>' +
    '<g transform="translate(128 128) scale(0.78) translate(-128 -128)">' + body('#000') + '</g>';
});
</script>
</body></html>
